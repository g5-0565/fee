<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aastha Store</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial;
            background-color: #f5f0ff;
        }
        .navbar {
            height: 70px;
            background-color: purple;
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px;
        }
        .links {
            display: flex;
            gap: 20px;
        }
        .links a {
            color: white;
            text-decoration: none;
        }
        .main {
            display: flex;
            min-height: 80vh;
        }
        .left {
            width: 20%;
            background-color: white;
            padding: 25px;
        }

        .left h3 {
            color: purple;
            margin-bottom: 20px;
        }

        .left p {
            margin: 15px 0;
        }
        .middle {
            width: 60%;
            padding: 30px;
        }
        .middle h1 {
            margin-bottom: 10px;
        }
        .products {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        .product {
            background-color: white;
            border: 2px solid purple;

            padding: 20px;

            width: 160px;
            text-align: center;
        }
        .product h3 {
            margin-bottom: 10px;
        }
        .product p {
            color: purple;
            margin-bottom: 10px;
        }
        button {
            background-color: purple;
            color: white;

            border: none;
            padding: 8px 15px;

            cursor: pointer;
        }
        .right {
            width: 20%;
            background-color: white;
            padding: 25px;
        }

        .right h3 {
            margin-bottom: 15px;
        }
        footer {
            height: 50px;
            background-color: purple;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>Aastha Store</h2>
        <div class="links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart</a>
        </div>
    </div>
    <div class="main">
        <div class="left">
            <h3>Categories</h3>
            <p>Clothes</p>
            <p>Shoes</p>
            <p>Electronics</p>
            <p>Accessories</p>
        </div>
        <div class="middle">
            <h1>Welcome to Aastha Store!</h1>
            <p>Choose your favorite product.</p>
            <div class="products">
                <div class="product">
                    <h3>Shirt</h3>
                    <p>₹599</p>
                    <button>Buy</button>
                </div>
                <div class="product">
                    <h3>Shoes</h3>
                    <p>₹999</p>
                    <button>Buy</button>
                </div>
                <div class="product">
                    <h3>Watch</h3>
                    <p>₹1499</p>
                    <button>Buy</button>
                </div>
            </div>
        </div>
        <div class="right">
            <h3>Store Info</h3>
            <p>Free Delivery</p>
            <br>
            <p>Easy Returns</p>
            <br>
            <p>Secure Payment</p>
        </div>
    </div>
    <footer>
        Aastha Store
    </footer>
</body>
</html>
