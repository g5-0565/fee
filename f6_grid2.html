<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Prachi">
    <title>Grid Styling 2</title>
    <link rel="stylesheet" href="">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courgette&family=Dancing+Script:wght@400..700&display=swap');

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100dvh;
            font-family: "Courgette";
            font-size: 16px;
            background-color: white;
            color: white;
        }
        section{
            padding: 10px;
        }
        .box{
            background-color: #ee8e91;
            color: rgb(1, 0, 0);
            padding: 1rem;
        }
        .gc{
            display: grid;
            gap: 0.5rem;
            grid-template-columns: repeat(3,150px);
            grid-template-rows: repeat(3,150px);
            place-content: center;
        }
        #m1{
            grid-column-start:1;
            grid-column-end:3;

            grid-row-start:1;
            grid-row-end:2;
        }
        #m2{
            grid-column-start:3;
            grid-column-end:4;

            grid-row-start:1;
            grid-row-end:3;
        }
        #m3{
            grid-column-start:1;
            grid-column-end:2;

            grid-row-start:2;
            grid-row-end:4;
        }
        #m5{
            grid-column-start:2;
            grid-column-end:4;

            grid-row-start:3;
            grid-row-end:4;
        }
        @media (min-width: 767px){
            .gc{
                grid-template-columns: repeat(3,250px);
                grid-template-rows: repeat(3,150px);
            }
        }
        @media (min-width: 1024px){
            .gc{
                grid-template-columns: repeat(3,350px);
                grid-template-rows: repeat(3,150px);
            }
            
        }
    </style>
</head>
<body>
    <section class="box" style="height: 10vh">
        <span style="font-size: 2.5rem; margin-right: 1rem;">&#9812</span>
        Header/Navbar
    </section>
    <section
        class="box gc"
        style="height: 80vh;background-color: white;"
        >
    <main class="box" id="m1">Content-1</main>
    <main class="box" id="m2">Content-2</main>
    <main class="box" id="m3">Content-3</main>
    <main class="box" id="m4">Content-4</main>
    <main class="box" id="m5">Content-5</main>
    </section>
    <section class="box" style="height: 10vh">
        <span style="font-size: 2rem; margin-right: 1rem;">&#9776</span>
        Aastha garcha
        2510990565
    </section>
    </body>
</body>
</html>
