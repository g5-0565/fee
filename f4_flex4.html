
<!DOCTYPE html>
<html>
<head>
    <title>Aastha Garcha</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(
                135deg,
                #ffd6d6,
                #ffe9e9
            );

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }
        .container {
            width: 700px;
            height: 450px;

            background-color: #fff8f8;

            border: 4px solid #e57373;
            border-radius: 30px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .circles {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 35px;
        }

        .circle {
            width: 120px;
            height: 120px;

            border: 4px solid #222;
            border-radius: 50%;

            margin-left: -25px;

            box-shadow: 3px 5px 10px rgba(0, 0, 0, 0.2);

            transition: 0.3s;
        }
        .circle:first-child {
            margin-left: 0;
            background-color: #ff8585;
        }
        .circle:nth-child(2) {
            background-color: #ffb6b9;
        }
        .circle:nth-child(3) {
            background-color: #ffb07c;
        }

        .circle:hover {
            transform: translateY(-10px);
        }

        .name {
            font-family: cursive;
            font-size: 50px;
            font-weight: bold;
            color: #0d0505;
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.15);
        }

        /* Decorative line */
        .line {
            width: 250px;
            height: 3px;

            background-color: #e57373;

            margin-top: 20px;
            position: relative;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="circles">

            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>

        </div>

        <div class="name">
            Aastha Garcha
        </div>
    </div>

</body>
</html>
