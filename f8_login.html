<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background-color: #e8eaf6;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            width: 500px;

            background-color: white;

            padding: 35px;

            border: 3px solid #303f9f;

            box-shadow: 10px 10px 0px #303f9f;

            border-radius: 5px;
        }
        h1 {
            color: #303f9f;

            font-size: 34px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;

            font-size: 17px;

            margin-bottom: 25px;
        }
        label {
            display: block;

            font-size: 15px;

            font-weight: bold;

            color: #303030;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            font-size: 15px;

            border: 2px solid #9fa8da;

            border-radius: 5px;

            outline: none;

            margin-bottom: 18px;
        }

        input:focus {
            border-color: #3f51b5;

            background-color: #f5f6ff;
        }
        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        #show-password {
            position: absolute;

            right: 12px;

            top: 11px;

            cursor: pointer;

            font-size: 18px;
        }

        #login-btn {
            width: 100%;

            padding: 14px;

            background-color: #5c6bc0;

            color: white;

            border: 2px solid #303f9f;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            border-radius: 5px;

            box-shadow: 4px 4px 0px #303f9f;

            transition: 0.2s;
        }

        #login-btn:hover {
            background-color: #3949ab;
        }

        #login-btn:active {
            transform: translate(3px, 3px);

            box-shadow: 1px 1px 0px #303f9f;
        }

        /* Message */
        #message {
            text-align: center;

            margin-top: 18px;

            font-weight: bold;
        }

        .success {
            color: #2e7d32;
        }

        .error {
            color: #d32f2f;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <h1>LOGIN PORTAL</h1>

        <p class="subtitle">
            Welcome to Aastha's Portal!!
        </p>
        <label for="username">
            USERNAME
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter your username"
        >
        <label for="mobile">
            MOBILE NUMBER
        </label>

        <input
            type="tel"
            id="mobile"
            placeholder="Enter your mobile number"
            maxlength="10"
        >

        <label for="email">
            EMAIL
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >
        <label for="password">
            PASSWORD
        </label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <span id="show-password">
                show
            </span>

        </div>
        <button id="login-btn">
            SIGN IN NOW
        </button>

        <p id="message"></p>

    </div>


    <script>

        const loginBtn = document.getElementById("login-btn");

        const username = document.getElementById("username");

        const mobile = document.getElementById("mobile");

        const email = document.getElementById("email");

        const password = document.getElementById("password");

        const message = document.getElementById("message");

        const showPassword =
            document.getElementById("show-password");
        showPassword.addEventListener("click", function() {

            if (password.type === "password") {

                password.type = "text";

                showPassword.innerText = "🙈";

            } else {

                password.type = "password";

                showPassword.innerText = "👁️";

            }

        });
        loginBtn.addEventListener("click", function() {

            let usernameValue = username.value.trim();

            let mobileValue = mobile.value.trim();

            let emailValue = email.value.trim();

            let passwordValue = password.value.trim();
            if (
                usernameValue === "" ||
                mobileValue === "" ||
                emailValue === "" ||
                passwordValue === ""
            ) {

                message.innerText =
                    "Please fill all the fields.";

                message.className = "error";

                return;
            }
            if (mobileValue.length !== 10 ||
                isNaN(mobileValue)) {

                message.innerText =
                    "Please enter a valid 10-digit mobile number.";

                message.className = "error";

                return;
            }
            if (!emailValue.includes("@")) {

                message.innerText =
                    "Please enter a valid email.";

                message.className = "error";

                return;
            }
            message.innerText =
                "Login Successful! 🎉";

            message.className = "success";

        });

    </script>

</body>
</html>
