<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #f8d7e8,
                #ddd6f3
            );
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }
        .todo {
            width: 500px;
            background-color: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(80, 50, 100, 0.2);
            border-top: 6px solid #9c27b0;
        }
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            color: #7b1fa2;
            font-size: 30px;
        }
        #theme-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            background-color: #ede7f6;
            color: #6a1b9a;
            cursor: pointer;
            transition: 0.3s;
        }
        #theme-btn:hover {
            background-color: #d1c4e9;
        }
        .subtitle {
            color: #777;
            margin-top: 8px;
            margin-bottom: 25px;
        }
        .input-area {
            display: flex;
            gap: 8px;
        }
        #task-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e1bee7;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }
        #task-input:focus {
            border-color: #9c27b0;
        }
        #add-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background-color: #7e57c2;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #add-btn:hover {
            background-color: #5e35b1;
            transform: translateY(-2px);
        }
        .task {
            margin-top: 15px;
            padding: 14px;
            background-color: #faf3ff;
            border-left: 5px solid #ab47bc;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }
        .task:hover {
            transform: translateX(4px);
            box-shadow: 0 3px 10px rgba(150, 80, 180, 0.15);
        }
        .task span {
            cursor: pointer;
            color: #444;
        }
        .delete-btn {
            padding: 7px 12px;
            border: none;
            border-radius: 7px;
            background-color: #ffcdd2;
            color: #c62828;
            cursor: pointer;
            transition: 0.3s;
        }
        .delete-btn:hover {
            background-color: #ef5350;
            color: white;
        }
        .completed {
            text-decoration: line-through;

            color: #43a047 !important;
        }
        .dark-theme {
            background: linear-gradient(
                135deg,
                #21152b,
                #29204a
            );
        }
        .dark-theme .todo {
            background-color: #30283d;
        }
        .dark-theme .title {
            color: #ce93d8;
        }
        .dark-theme .subtitle {
            color: #bbb;
        }
        .dark-theme #task-input {
            background-color: #40364f;
            color: white;
        }
        .dark-theme .task {
            background-color: #40364f;
        }
        .dark-theme .task span {
            color: white;
        }
    </style>
</head>
<body>
    <div class="todo">

        <div class="top">
            <h1 class="title">
                My Tasks ✨
            </h1>
            <button id="theme-btn">
                Theme
            </button>

        </div>
        <p class="subtitle">
            Stay organized, one task at a time.
        </p>

        <div class="input-area">
            <input
                type="text"
                id="task-input"
                placeholder="What do you need to do?"
            >
            <button id="add-btn">
                + Add
            </button>

        </div>
        <div class="task">
            <span>
                Complete my assignment
            </span>

            <button class="delete-btn">
                Delete
            </button>

        </div>

    </div>
    <script>

        const themeBtn = document.getElementById("theme-btn");

        themeBtn.addEventListener("click", function() {

            document.body.classList.toggle("dark-theme");

        });
        const addBtn = document.getElementById("add-btn");

        const input = document.getElementById("task-input");

        addBtn.addEventListener("click", function() {

            if (input.value.trim() === "") {
                return;
            }

            const taskDiv = document.createElement("div");

            taskDiv.className = "task";

            taskDiv.innerHTML = `
                <span>${input.value}</span>
                <button class="delete-btn">Delete</button>
            `;

            document.querySelector(".todo").appendChild(taskDiv);

            input.value = "";

            addTaskEvents(taskDiv);

        });
        function addTaskEvents(taskDiv) {

            const taskText = taskDiv.querySelector("span");

            const deleteBtn = taskDiv.querySelector(".delete-btn");
            taskText.addEventListener("click", function() {

                taskText.classList.toggle("completed");

            });
            deleteBtn.addEventListener("click", function() {

                taskDiv.remove();

            });

        }
        const sampleTask = document.querySelector(".task");

        addTaskEvents(sampleTask);

    </script>

</body>
</html>
